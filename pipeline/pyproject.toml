[project]
name = "notetaker-pipeline"
version = "0.1.0"
description = "Notetaker pipeline: EchoPad recording folder + the app's speaker turns -> transcript Markdown (Qwen3-ASR via mlx-audio)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mlx-audio[stt]>=0.5.8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"  # nothing written next to the sources
filterwarnings = ["ignore::scipy.io.wavfile.WavFileWarning"]
