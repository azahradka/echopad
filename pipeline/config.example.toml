# The app writes this file to ~/Library/Application Support/EchoPad/config.toml
# ($ECHOPAD_DATA_DIR/config.toml if set); transcribe.sh passes it as --config.
vault = "/Users/azahradka/Documents/Obsidian/Work"
# Default: <vault>/_attachments/transcripts (exclude it from Obsidian Sync).
transcripts_dir = "/Users/azahradka/Documents/Obsidian/Work/_attachments/transcripts"
glossary_path = "/Users/azahradka/Documents/Obsidian/Work/Admin/Meeting Glossary.md"
log_book_dir = "/Users/azahradka/Documents/Obsidian/Work/Log Book"
# Speaker label for the mic track in calls.
your_name = "Aron"
# Model for the headless claude -p hand-off.
claude_model = "sonnet"
# Days to keep a transcript (retain_until = start + this), unless it says retain: keep. Default 3.
retention_days = 3
# Let the hand-off look up the meeting in the Outlook calendar. Default true.
calendar = true
